name: Packaged smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run package:linux

      - name: Smoke test AppImage and deb
        run: xvfb-run -a node scripts/smoke-packaged.mjs --linux --unpacked

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-linux-logs
          path: test-results/packaged-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows installer + portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run package:win

      - name: Smoke test installer and portable
        run: node scripts/smoke-packaged.mjs --win

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-windows-logs
          path: test-results/packaged-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-windows-artifacts
          path: release/*.exe
          if-no-files-found: ignore
          retention-days: 7
